    data_type: VARCHAR
  time_dimensions:
  - name: SNAPSHOT_DT
    expr: SNAPSHOT_DT
    data_type: DATE
  facts:
  - name: QTY_ON_HAND
    expr: QTY_ON_HAND
    data_type: NUMBER
  - name: AVG_DAILY_DEMAND_QTY
    expr: AVG_DAILY_DEMAND_QTY
    data_type: NUMBER
- name: ORDERS
  base_table:
    database: SUPPLY_CHAIN_DEMO
    schema: CORE
    table: ORDERS
  primary_key:
    columns:
    - ORDER_ID
  dimensions:
  - name: ORDER_ID
    expr: ORDER_ID
    data_type: VARCHAR
  - name: CUSTOMER_ID
    expr: CUSTOMER_ID
    data_type: VARCHAR
  - name: CUSTOMER_NAME
    expr: CUSTOMER_NAME
    data_type: VARCHAR
    synonyms:
    - customer
  - name: PLANT_ID
    expr: PLANT_ID
    data_type: VARCHAR
  - name: PART_ID
    expr: PART_ID
    data_type: VARCHAR
  - name: ORDER_STATUS
    expr: ORDER_STATUS
    data_type: VARCHAR
  time_dimensions:
  - name: ORDER_DT
    expr: ORDER_DT
    data_type: DATE
  - name: REQUESTED_DELIVERY_DT
    expr: REQUESTED_DELIVERY_DT
    data_type: DATE
  - name: FULFILLED_DT
    expr: FULFILLED_DT
    data_type: DATE
  facts:
  - name: UNIT_PRICE
    expr: UNIT_PRICE
    data_type: NUMBER
  - name: QUANTITY_ORDERED
    expr: QUANTITY_ORDERED
    data_type: NUMBER
    description: Units ordered.
  - name: QUANTITY_FULFILLED
    expr: QUANTITY_FULFILLED
    data_type: NUMBER
    description: Units actually fulfilled.
  - name: IS_OTIF
    expr: CASE WHEN ABS(DATEDIFF('day', REQUESTED_DELIVERY_DT, FULFILLED_DT)) <= 1 AND QUANTITY_FULFILLED >= QUANTITY_ORDERED
      THEN 1 ELSE 0 END
    data_type: NUMBER
    description: 1 if the order was both on time and in full, else 0.
