verified_queries:
- name: otd_by_supplier
  question: What is the on-time delivery rate by supplier?
  sql: SELECT s.SUPPLIER_NAME, AVG(CASE WHEN ABS(DATEDIFF(DAY, sh.CONFIRMED_DELIVERY_DT, sh.ACTUAL_DELIVERY_DT)) <= 1 THEN
    1 ELSE 0 END) * 100 AS otd_pct FROM shipments AS sh JOIN suppliers AS s ON sh.SUPPLIER_ID = s.SUPPLIER_ID GROUP BY s.SUPPLIER_NAME
    ORDER BY otd_pct DESC
  verified_at: 1791015523
  verified_by: Semantic Model Generator
- name: overall_fill_rate
  question: What is the overall fill rate?
  sql: SELECT SUM(o.QUANTITY_FULFILLED) / SUM(o.QUANTITY_ORDERED) * 100 AS fill_rate_pct FROM orders AS o
  verified_at: 1791015523
  verified_by: Semantic Model Generator
- name: doi_by_category
  question: What are the days of inventory by part category?
  sql: SELECT p.PART_CATEGORY, AVG(inv.QTY_ON_HAND) / AVG(inv.AVG_DAILY_DEMAND_QTY) AS days_of_inventory FROM inventory_snapshots
    AS inv JOIN parts AS p ON inv.PART_ID = p.PART_ID GROUP BY p.PART_CATEGORY
  verified_at: 1791015523
  verified_by: Semantic Model Generator
- name: landed_cost_by_supplier
  question: What is the average landed cost per unit by supplier?
  sql: SELECT s.SUPPLIER_NAME, AVG(p.UNIT_COST + sh.FREIGHT_COST_PER_UNIT + sh.DUTY_COST_PER_UNIT) AS landed_cost_per_unit
    FROM shipments AS sh JOIN parts AS p ON sh.PART_ID = p.PART_ID JOIN suppliers AS s ON sh.SUPPLIER_ID = s.SUPPLIER_ID GROUP
    BY s.SUPPLIER_NAME ORDER BY landed_cost_per_unit DESC
  verified_at: 1791015523
  verified_by: Semantic Model Generator
- name: otif_by_region
  question: What is the OTIF performance by plant region?
  sql: SELECT pl.PLANT_REGION, AVG(CASE WHEN ABS(DATEDIFF(DAY, o.REQUESTED_DELIVERY_DT, o.FULFILLED_DT)) <= 1 AND o.QUANTITY_FULFILLED
    >= o.QUANTITY_ORDERED THEN 1 ELSE 0 END) * 100 AS otif_pct FROM orders AS o JOIN plants AS pl ON o.PLANT_ID = pl.PLANT_ID
    GROUP BY pl.PLANT_REGION
  verified_at: 1791015523
  verified_by: Semantic Model Generator
metrics:
- name: OTD_PCT
  synonyms:
  - OTD
  - on-time delivery rate
  - on-time delivery percentage
  description: 'On-Time Delivery %: percentage of shipments delivered within 1 day of confirmed date.'
  expr: AVG(SHIPMENTS.IS_ON_TIME) * 100
  default_aggregation: avg
- name: FILL_RATE_PCT
  synonyms:
  - fill rate
  - order fill rate
  description: 'Fill Rate %: volume-weighted SUM(quantity_fulfilled) / SUM(quantity_ordered) * 100.'
  expr: SUM(ORDERS.QUANTITY_FULFILLED) / SUM(ORDERS.QUANTITY_ORDERED) * 100
  default_aggregation: avg
- name: DAYS_OF_INVENTORY
  synonyms:
  - DOI
  - inventory days
  - days of supply
  description: 'Days of Inventory: AVG(qty_on_hand) / AVG(avg_daily_demand_qty).'
  expr: AVG(INVENTORY_SNAPSHOTS.QTY_ON_HAND) / AVG(INVENTORY_SNAPSHOTS.AVG_DAILY_DEMAND_QTY)
  default_aggregation: avg
- name: LANDED_COST_PER_UNIT
  synonyms:
  - landed cost
  - total landed cost
  description: 'Landed Cost per unit: AVG(unit_cost + freight + duty).'
  expr: AVG(PARTS.UNIT_COST + SHIPMENTS.FREIGHT_COST_PER_UNIT + SHIPMENTS.DUTY_COST_PER_UNIT)
  default_aggregation: avg
- name: OTIF_PCT
  synonyms:
  - OTIF
  - on time in full
  description: 'OTIF %: percentage of orders delivered on time and in full.'
  expr: AVG(ORDERS.IS_OTIF) * 100
  default_aggregation: avg