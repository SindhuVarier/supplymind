name: SUPPLY_CHAIN_UNIFIED
description: 'Unified automotive supply chain ontology covering suppliers, parts, plants, shipments, inventory snapshots,
  and customer orders. Supports Planner, Procurement, and Logistics personas with 5 canonical KPIs: On-Time Delivery (OTD),
  Fill Rate, Days of Inventory (DOI), Landed Cost, and OTIF (On-Time-In-Full).'
tables:
- name: SUPPLIERS
  base_table:
    database: SUPPLY_CHAIN_DEMO
    schema: CORE
    table: SUPPLIERS
  primary_key:
    columns:
    - SUPPLIER_ID
  dimensions:
  - name: SUPPLIER_ID
    expr: SUPPLIER_ID
    data_type: VARCHAR
  - name: SUPPLIER_NAME
    expr: SUPPLIER_NAME
    data_type: VARCHAR
    synonyms:
    - vendor
    - vendor name
    description: Supplier display name.
  - name: SUPPLIER_REGION
    expr: SUPPLIER_REGION
    data_type: VARCHAR
  - name: COUNTRY
    expr: COUNTRY
    data_type: VARCHAR
  - name: RELIABILITY_TIER
    expr: RELIABILITY_TIER
    data_type: VARCHAR
    description: Gold / Silver / Bronze reliability classification.
  time_dimensions:
  - name: CREATED_DT
    expr: CREATED_DT
    data_type: DATE
  facts:
  - name: OTD_TARGET_PCT
    expr: OTD_TARGET_PCT
    data_type: NUMBER
    description: Supplier's contracted on-time delivery target percentage.
  - name: LEAD_TIME_DAYS_AVG
    expr: LEAD_TIME_DAYS_AVG
    data_type: NUMBER
    description: Average quoted lead time in days.
- name: PARTS
  base_table:
    database: SUPPLY_CHAIN_DEMO
    schema: CORE
    table: PARTS
  primary_key:
    columns:
    - PART_ID
  dimensions:
  - name: PART_ID
    expr: PART_ID
    data_type: VARCHAR
  - name: PART_NAME
    expr: PART_NAME
    data_type: VARCHAR
  - name: PART_CATEGORY
    expr: PART_CATEGORY
    data_type: VARCHAR
    synonyms:
    - category
  - name: SUPPLIER_ID
    expr: SUPPLIER_ID
    data_type: VARCHAR
  - name: UOM
    expr: UOM
    data_type: VARCHAR
  facts:
  - name: UNIT_COST
    expr: UNIT_COST
    data_type: NUMBER
  - name: WEIGHT_KG
    expr: WEIGHT_KG
    data_type: NUMBER
- name: PLANTS
  base_table:
    database: SUPPLY_CHAIN_DEMO
    schema: CORE
    table: PLANTS
  primary_key:
    columns:
    - PLANT_ID
  dimensions:
  - name: PLANT_ID
    expr: PLANT_ID
    data_type: VARCHAR
  - name: PLANT_NAME
    expr: PLANT_NAME
    data_type: VARCHAR
  - name: PLANT_REGION
    expr: PLANT_REGION
    data_type: VARCHAR
    synonyms:
    - region
  - name: PLANT_COUNTRY
    expr: PLANT_COUNTRY
    data_type: VARCHAR
  - name: PLANT_CITY
    expr: PLANT_CITY
    data_type: VARCHAR
- name: SHIPMENTS
  base_table:
    database: SUPPLY_CHAIN_DEMO
    schema: CORE
    table: SHIPMENTS
  primary_key:
    columns:
    - SHIPMENT_ID
  dimensions:
  - name: SHIPMENT_ID
    expr: SHIPMENT_ID
    data_type: VARCHAR
  - name: SUPPLIER_ID
    expr: SUPPLIER_ID
    data_type: VARCHAR
  - name: PART_ID
    expr: PART_ID
    data_type: VARCHAR
  - name: PLANT_ID
    expr: PLANT_ID
    data_type: VARCHAR
  - name: CARRIER
    expr: CARRIER
    data_type: VARCHAR
    synonyms:
    - logistics provider
    - freight carrier
  - name: STATUS
    expr: STATUS
    data_type: VARCHAR
  time_dimensions:
  - name: SHIP_DT
    expr: SHIP_DT
    data_type: DATE
  - name: CONFIRMED_DELIVERY_DT
    expr: CONFIRMED_DELIVERY_DT
    data_type: DATE
  - name: ACTUAL_DELIVERY_DT
    expr: ACTUAL_DELIVERY_DT
    data_type: DATE
  facts:
  - name: FREIGHT_COST_PER_UNIT
    expr: FREIGHT_COST_PER_UNIT
    data_type: NUMBER
  - name: DUTY_COST_PER_UNIT
    expr: DUTY_COST_PER_UNIT
    data_type: NUMBER
  - name: QUANTITY_SHIPPED
    expr: QUANTITY_SHIPPED
    data_type: NUMBER
    description: Units shipped.
  - name: IS_ON_TIME
    expr: CASE WHEN ABS(DATEDIFF('day', CONFIRMED_DELIVERY_DT, ACTUAL_DELIVERY_DT)) <= 1 THEN 1 ELSE 0 END
    data_type: NUMBER
    description: 1 if delivered within 1 day of confirmed date, else 0.
- name: INVENTORY_SNAPSHOTS
  base_table:
