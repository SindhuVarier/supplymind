definition_version: 2
entities:
  streamlit_app:
    type: streamlit
    main_file: app.py
    artifacts:
      - pyproject.toml
      - app.py
      - .streamlit/config.toml
    identifier:
      database: SUPPLY_CHAIN_DEMO
      schema: CORE
      name: STREAMLIT_APP
    title: streamlit_app
    query_warehouse: COMPUTE_WH
    compute_pool: SYSTEM_COMPUTE_POOL_CPU
    run_mode: SpcsOnly
    execute_as: OWNER
    sharing:
      - role: ACCOUNTADMIN
        with_grant_option: true
      - role: SYSADMIN
        with_grant_option: true
      - role: DEV
        with_grant_option: false
